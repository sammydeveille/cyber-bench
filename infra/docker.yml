name: cyber-bench

services:
  defectdojo:
    container_name: defectdojo
    hostname: uwsgi
    image: defectdojo/defectdojo-django:2.36.0
    platform: linux/amd64
    env_file: ../.env
    volumes:
      - defectdojo-media:/app/media
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started

  defectdojo-nginx:
    container_name: defectdojo-nginx
    image: defectdojo/defectdojo-nginx:2.36.0
    platform: linux/amd64
    ports:
      - "8080:8080"
    volumes:
      - defectdojo-media:/usr/share/nginx/html/media
    depends_on:
      - defectdojo

  influxdb:
    container_name: influxdb
    image: influxdb:2.7
    ports:
      - "8086:8086"
    env_file: ../.env

  juice-shop:
    container_name: juice-shop
    image: bkimminich/juice-shop
    ports:
      - "3000:3000"

  nuclei:
    container_name: nuclei
    image: projectdiscovery/nuclei:latest
    entrypoint: ["/bin/sh", "-c", "sleep infinity"]
    volumes:
      - ../data/nuclei:/root/nuclei-templates

  nmap:
    container_name: nmap
    image: instrumentisto/nmap
    entrypoint: ["/bin/sh", "-c", "sleep infinity"]
    volumes:
      - ../data/nmap:/data

  nikto:
    container_name: nikto
    image: frapsoft/nikto
    platform: linux/amd64
    entrypoint: ["/bin/sh", "-c", "sleep infinity"]
    volumes:
      - ../data/nikto:/tmp

  owasp-zap:
    container_name: owasp-zap
    image: zaproxy/zap-stable:latest
    ports:
      - "8090:8090"
    volumes:
      - ../data/zap:/zap/wrk
    command: ["zap.sh", "-daemon", "-host", "0.0.0.0", "-port", "8090", "-config", "api.addrs.addr.name=.*", "-config", "api.addrs.addr.regex=true", "-config", "api.disablekey=true"]

  postgres:
    container_name: postgres
    image: postgres:15
    env_file: ../.env
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U defectdojo"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    container_name: redis
    image: redis:7-alpine

volumes:
  defectdojo-media:
  postgres-data:
