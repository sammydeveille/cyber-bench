version: '3.8'

name: cyber-bench

services:
  defectdojo:
    image: defectdojo/defectdojo-django:latest
    ports:
      - "8080:8080"
    environment:
      - DD_DATABASE_URL=postgresql://defectdojo:defectdojo@postgres:5432/defectdojo
      - DD_SECRET_KEY=change-me-in-production
      - DD_ALLOWED_HOSTS=*
    depends_on:
      - postgres

  influxdb:
    image: influxdb:2.7
    ports:
      - "8086:8086"
    environment:
      - DOCKER_INFLUXDB_INIT_MODE=setup
      - DOCKER_INFLUXDB_INIT_USERNAME=admin
      - DOCKER_INFLUXDB_INIT_PASSWORD=adminpassword
      - DOCKER_INFLUXDB_INIT_ORG=cyberbench
      - DOCKER_INFLUXDB_INIT_BUCKET=metrics

  nuclei:
    image: projectdiscovery/nuclei:latest
    command: ["sleep", "infinity"]
    volumes:
      - ../data/nuclei:/root/nuclei-templates

  owasp-zap:
    image: zaproxy/zap-stable:latest
    ports:
      - "8090:8090"
    command: ["zap.sh", "-daemon", "-host", "0.0.0.0", "-port", "8090", "-config", "api.addrs.addr.name=.*", "-config", "api.addrs.addr.regex=true"]

  postgres:
    image: postgres:15
    environment:
      - POSTGRES_DB=defectdojo
      - POSTGRES_USER=defectdojo
      - POSTGRES_PASSWORD=defectdojo
    volumes:
      - postgres-data:/var/lib/postgresql/data

volumes:
  postgres-data:
