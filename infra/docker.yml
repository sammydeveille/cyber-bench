name: cyber-bench

services:
  defectdojo:
    container_name: defectdojo
    hostname: uwsgi
    image: defectdojo/defectdojo-django:2.36.0
    platform: linux/amd64
    environment:
      - DD_DATABASE_URL=postgresql://defectdojo:defectdojo@postgres:5432/defectdojo
      - DD_SECRET_KEY=change-me-in-production
      - DD_ALLOWED_HOSTS=*
      - DD_CELERY_BROKER_URL=redis://redis:6379/0
    volumes:
      - defectdojo-media:/app/media
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started

  defectdojo-nginx:
    container_name: defectdojo-nginx
    image: defectdojo/defectdojo-nginx:2.36.0
    platform: linux/amd64
    ports:
      - "8080:8080"
    volumes:
      - defectdojo-media:/usr/share/nginx/html/media
    depends_on:
      - defectdojo

  influxdb:
    container_name: influxdb
    image: influxdb:2.7
    ports:
      - "8086:8086"
    environment:
      - DOCKER_INFLUXDB_INIT_MODE=setup
      - DOCKER_INFLUXDB_INIT_USERNAME=admin
      - DOCKER_INFLUXDB_INIT_PASSWORD=adminpassword
      - DOCKER_INFLUXDB_INIT_ORG=cyberbench
      - DOCKER_INFLUXDB_INIT_BUCKET=metrics

  nuclei:
    container_name: nuclei
    image: projectdiscovery/nuclei:latest
    command: ["sleep", "infinity"]
    volumes:
      - ../data/nuclei:/root/nuclei-templates

  owasp-zap:
    container_name: owasp-zap
    image: zaproxy/zap-stable:latest
    ports:
      - "8090:8090"
    command: ["zap.sh", "-daemon", "-host", "0.0.0.0", "-port", "8090", "-config", "api.addrs.addr.name=.*", "-config", "api.addrs.addr.regex=true"]

  postgres:
    container_name: postgres
    image: postgres:15
    environment:
      - POSTGRES_DB=defectdojo
      - POSTGRES_USER=defectdojo
      - POSTGRES_PASSWORD=defectdojo
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U defectdojo"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    container_name: redis
    image: redis:7-alpine

volumes:
  defectdojo-media:
  postgres-data:
